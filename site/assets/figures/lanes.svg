<svg xmlns="http://www.w3.org/2000/svg" id="lanes" role="img" aria-labelledby="lanes-title lanes-desc" viewBox="0 0 420 224" width="420" height="224" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="13" fill="#172b3a"><title id="lanes-title">Two concurrent loops: a main lane and a long lane</title><desc id="lanes-desc">The main lane advances many objects by one path per step; its steps carry a lot of work. The objects with the longest remaining chains move to a second loop that runs at the same time with short, frequent steps and drafts ahead, so they finish sooner.</desc><text x="0" y="16" font-size="14" fill="#008b83" text-anchor="start" font-weight="600">Brook runs two loops side by side</text><text x="0" y="44" font-size="13" fill="#172b3a" text-anchor="start" font-weight="600">Main lane</text><text x="0" y="60" font-size="12" fill="#606b76" text-anchor="start">many objects, one path each per step</text><rect x="0" y="70" width="100" height="26" rx="3" fill="#e3f2f0" stroke="#008b83"/><rect x="5.0" y="77" width="5.5" height="12" rx="1" fill="#008b83" opacity="0.7"/><rect x="12.5" y="77" width="5.5" height="12" rx="1" fill="#008b83" opacity="0.7"/><rect x="20.0" y="77" width="5.5" height="12" rx="1" fill="#008b83" opacity="0.7"/><rect x="27.5" y="77" width="5.5" height="12" rx="1" fill="#008b83" opacity="0.7"/><rect x="35.0" y="77" width="5.5" height="12" rx="1" fill="#008b83" opacity="0.7"/><rect x="42.5" y="77" width="5.5" height="12" rx="1" fill="#008b83" opacity="0.7"/><rect x="50.0" y="77" width="5.5" height="12" rx="1" fill="#008b83" opacity="0.7"/><rect x="57.5" y="77" width="5.5" height="12" rx="1" fill="#008b83" opacity="0.7"/><rect x="65.0" y="77" width="5.5" height="12" rx="1" fill="#008b83" opacity="0.7"/><rect x="72.5" y="77" width="5.5" height="12" rx="1" fill="#008b83" opacity="0.7"/><rect x="80.0" y="77" width="5.5" height="12" rx="1" fill="#008b83" opacity="0.7"/><rect x="87.5" y="77" width="5.5"