<svg xmlns="http://www.w3.org/2000/svg" id="drafts" role="img" aria-labelledby="drafts-title drafts-desc" viewBox="0 0 420 370" width="420" height="370" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="13" fill="#172b3a"><title id="drafts-title">Drafting ahead on a long object, like speculative decoding</title><desc id="drafts-desc">On the CPU a long object is traced one path after another. Brook drafts the next paths in parallel inside small private windows, then keeps a draft only if one-at-a-time tracing would have produced the same target and route, the draft stayed inside its window and it does not overlap an earlier draft. A draft that fails is dropped and traced again, so the skeleton is the one that tracing one path at a time gives.</desc><text x="0" y="16" font-size="14" fill="#6563aa" text-anchor="start" font-weight="600">TEASAR on the CPU</text><text x="420" y="16" font-size="12.5" fill="#606b76" text-anchor="end">one path, then the next</text><path d="M20 60 C 90 24, 170 94, 250 56 S 380 36, 404 64 C 410 88, 360 94, 300 82 S 150 114, 70 90 S 8 80, 20 60 Z" fill="#eceaf5" stroke="#6563aa" stroke-width="1.5"/><polyline points="28,66 80,60 130,70 180,74" fill="none" stroke="#6563aa" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="80" cy="60" r="3" fill="#6563aa"/><circle cx="130" cy="70" r="3" fill="#6563aa"/><circle cx="180" cy="74" r="3" fill="#6563aa"/><polyline points="180,74 230,64 280,60 330,60 380,64" fill="none" stroke="#6563aa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><rect x="0" y="124" width="98" height="18" rx="3" fill="#eceaf5" stroke="#6563aa"/><text x="49" y="137" font-size="12" fill="#172b3a" text-anchor="middle">path 1</text><rect x="104" y="124" width="98" height="18" rx="3" fill="#eceaf5" stroke="#6563aa"/><text x="153" y="137" font-size="12" fill="#172b3a" text-anchor="middle">path 2</text><rect x="208" y="124" width="98" height="18" rx="3" fill="#eceaf5" stroke="#6563aa"/><text x="257" y="137" font-size="12" fill="#172b3a" text-anchor="middle">path 3</text><rect x="312" y="124" width="98" height="18" rx="3" fill="#eceaf5" stroke="#6563aa"/><text x="361" y="137" font-size="12" fill="#172b3a" text-anchor="middle">path 4</text><text x="0" y="176" font-size="14" fill="#008b83" text-anchor="start" font-weight="600">Brook</text><text x="420" y="176" font-size="12.5" fill="#606b76" text-anchor="end">draft ahead, then check</text><path d="M20 220 C 90 184, 170 254, 250 216 S 380 196, 404 224 C 410 248, 360 254, 300 242 S 150 274, 70 250 S 8 240, 20 220 Z" fill="#e3f2f0" stroke="#008b83" stroke-width="1.5"/><rect x="72" y="198" width="116" height="58" rx="4" fill="none" stroke="#008b83" stroke-dasharray="4 3"/><rect x="172" y="198" width="116" height="58" rx="4" fill="none" stroke="#008b83" stroke-dasharray="4 3"/><rect x="272" y="198" width="116" height="48" rx="4" fill="none" stroke="#008b83" stroke-dasharray="4 3"/><polyline points="28,226 80,220" fill="none" stroke="#008b83" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="80,220 130,230 180,234" fill="none" stroke="#008b83" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="180,234 230,224 280,220" fill="none" stroke="#008b83" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="280,220 330,220 380,224" fill="none" stroke="#b04a3a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 3"/><rect x="0" y="284" width="150" height="18" rx="3" fill="#e3f2f0" stroke="#008b83"/><text x="75" y="297" font-size="12" fill="#172b3a" text-anchor="middle">3 drafts in parallel</text><rect x="156" y="284" width="70" height="18" rx="3" fill="#fff" stroke="#008b83"/><text x="191" y="297" font-size="12" fill="#172b3a" text-anchor="middle">check</text><text x="236" y="297" font-size="12.5" fill="#172b3a" text-anchor="start">keep 2, redo 1</text><text x="0" y="326" font-size="12.5" fill="#606b76" text-anchor="start">A draft is kept only if it has the same target and route</text><text x="0" y="344" font-size="12.5" fill="#606b76" text-anchor="start">that one-at-a-time tracing would give, stays inside its</text><text x="0" y="362" font-size="12.5" fill="#606b76" text-anchor="start">window and does not overlap an earlier draft.</text></svg>
