<svg xmlns="http://www.w3.org/2000/svg" id="wavefront" role="img" aria-labelledby="wavefront-title wavefront-desc" viewBox="0 0 420 352" width="420" height="352" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="13" fill="#172b3a"><title id="wavefront-title">Searching back to the skeleton: one voxel per step against one ring per step</title><desc id="wavefront-desc">Each new path starts at a target and searches for the nearest part of the skeleton already drawn. On the CPU a priority queue settles one voxel per step. Brook settles a whole ring of voxels per step in parallel and stops at the first ring that touches the skeleton.</desc><text x="0" y="16" font-size="14" fill="#6563aa" text-anchor="start" font-weight="600">TEASAR on the CPU</text><text x="420" y="16" font-size="12.5" fill="#606b76" text-anchor="end">a queue settles one voxel per step</text><g transform="translate(0 24)"><clipPath id="wavefront-clip-cpu"><path d="M18 70 C 30 22, 120 18, 190 34 S 330 20, 392 46 C 414 62, 408 104, 372 116 S 250 124, 180 112 S 40 128, 18 70 Z"/></clipPath><path d="M18 70 C 30 22, 120 18, 190 34 S 330 20, 392 46 C 414 62, 408 104, 372 116 S 250 124, 180 112 S 40 128, 18 70 Z" fill="#eff3f5" stroke="#606b76" stroke-width="1.2"/><circle cx="90" cy="60" r="9" fill="#eceaf5" stroke="#6563aa"/><text x="90" y="64" font-size="10.5" fill="#6563aa" text-anchor="middle">1</text><circle cx="58" cy="88" r="9" fill="#eceaf5" stroke="#6563aa"/><text x="58" y="92" font-size="10.5" fill="#6563aa" text-anchor="middle">2</text><circle cx="96" cy="92" r="9" fill="#eceaf5" stroke="#6563aa"/><text x="96" y="96" font-size="10.5" fill="#6563aa" text-anchor="middle">3</text><circle cx="52" cy="54" r="9" fill="#eceaf5" stroke="#6563aa"/><text x="52" y="58" font-size="10.5" fill="#6563aa" text-anchor="middle">4</text><circle cx="118" cy="70" r="9" fill="#eceaf5" stroke="#6563aa"/><text x="118" y="74" font-size="10.5" fill="#6563aa" text-anchor="middle">5</text><circle cx="80" cy="104" r="9" fill="#eceaf5" stroke="#6563aa"/><text x="80" y="108" font-size="10.5" fill="#6563aa" text-anchor="middle">6</text><circle cx="122" cy="48" r="9" fill="#eceaf5" stroke="#6563aa"/><text x="122" y="52" font-size="10.5" fill="#6563aa" text-anchor="middle">7</text><circle cx="34" cy="76" r="9" fill="#eceaf5" stroke="#6563aa"/><text x="34" y="80" font-size="10.5" fill="#6563aa" text-anchor="middle">8</text><text x="150" y="84" font-size="16" fill="#6563aa" text-anchor="start">…</text><path d="M300 34 C 312 60, 318 84, 332 116" fill="none" stroke="#172b3a" stroke-width="4" stroke-linecap="round"/><circle cx="70" cy="72" r="6" fill="#6563aa"/></g><text x="0" y="184" font-size="14" fill="#008b83" text-anchor="start" font-weight="600">Brook</text><text x="420" y="184" font-size="12.5" fill="#606b76" text-anchor="end">a whole ring of voxels per step</text><g transform="translate(0 192)"><clipPath id="wavefront-clip-gpu"><path d="M18 70 C 30 22, 120 18, 190 34 S 330 20, 392 46 C 414 62, 408 104, 372 116 S 250 124, 180 112 S 40 128, 18 70 Z"/></clipPath><path d="M18 70 C 30 22, 120 18, 190 34 S 330 20, 392 46 C 414 62, 408 104, 372 116 S 250 124, 180 112 S 40 128, 18 70 Z" fill="#eff3f5" stroke="#606b76" stroke-width="1.2"/><g clip-path="url(#wavefront-clip-gpu)"><circle cx="70" cy="72" r="238" fill="#eef7f5" stroke="#008b83" stroke-width="1" stroke-opacity="0.6"/><circle cx="70" cy="72" r="158" fill="#e3f2f0" stroke="#008b83" stroke-width="1" stroke-opacity="0.6"/><circle cx="70" cy="72" r="78" fill="#d2ebe7" stroke="#008b83" stroke-width="1" stroke-opacity="0.6"/></g><text x="112" y="60" font-size="11.5" fill="#008b83" text-anchor="middle">step 1</text><text x="190" y="60" font-size="11.5" fill="#008b83" text-anchor="middle">step 2</text><text x="262" y="60" font-size="11.5" fill="#008b83" text-anchor="middle">step 3</text><circle cx="303" cy="74" r="10" fill="none" stroke="#008b83" stroke-width="2.5"/><path d="M300 34 C 312 60, 318 84, 332 116" fill="none" stroke="#172b3a" stroke-width="4" stroke-linecap="round"/><circle cx="70" cy="72" r="6" fill="#008b83"/></g><circle cx="6" cy="340" r="5" fill="#172b3a" fill-opacity="0.8"/><text x="16" y="344" font-size="12.5" fill="#606b76" text-anchor="start">target</text><line x1="70" y1="340" x2="92" y2="340" stroke="#172b3a" stroke-width="4" stroke-linecap="round"/><text x="98" y="344" font-size="12.5" fill="#606b76" text-anchor="start">skeleton so far</text><circle cx="220" cy="340" r="7" fill="none" stroke="#008b83" stroke-width="2.5"/><text x="232" y="344" font-size="12.5" fill="#606b76" text-anchor="start">first contact: the search stops</text></svg>
