<svg xmlns="http://www.w3.org/2000/svg" id="floods" role="img" aria-labelledby="floods-title floods-desc" viewBox="0 0 420 360" width="420" height="360" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="13" fill="#172b3a"><title id="floods-title">Distance fields: one object at a time against one flood for many objects</title><desc id="floods-desc">On the CPU each object's distance field is computed by its own flood, one object after another. Brook runs a single flood over the whole volume; a wave may only move between voxels of the same object, so each object still gets exactly its own field.</desc><text x="0" y="16" font-size="14" fill="#6563aa" text-anchor="start" font-weight="600">TEASAR on the CPU</text><text x="420" y="16" font-size="12.5" fill="#606b76" text-anchor="end">one object’s flood at a time</text><g transform="translate(0 26)"><clipPath id="floods-c0-1"><path d="M10 40 C 20 8, 110 6, 130 34 C 140 60, 128 104, 96 110 C 50 118, 4 84, 10 40 Z"/></clipPath><path d="M10 40 C 20 8, 110 6, 130 34 C 140 60, 128 104, 96 110 C 50 118, 4 84, 10 40 Z" fill="#eff3f5" stroke="#606b76" stroke-width="1.2"/><g clip-path="url(#floods-c0-1)"><circle cx="54" cy="62" r="90" fill="#eceaf5" stroke="#6563aa" stroke-opacity="0.35"/><circle cx="54" cy="62" r="60" fill="#eceaf5" stroke="#6563aa" stroke-opacity="0.6"/><circle cx="54" cy="62" r="30" fill="#eceaf5" stroke="#6563aa" stroke-opacity="0.9"/></g><circle cx="54" cy="62" r="4.5" fill="#6563aa"/><clipPath id="floods-c1-1"><path d="M130 34 C 160 14, 250 10, 276 40 C 292 64, 262 106, 212 110 C 170 114, 124 96, 128 70 C 130 56, 126 44, 130 34 Z"/></clipPath><path d="M130 34 C 160 14, 250 10, 276 40 C 292 64, 262 106, 212 110 C 170 114, 124 96, 128 70 C 130 56, 126 44, 130 34 Z" fill="#eff3f5" stroke="#606b76" stroke-width="1.2"/><circle cx="206" cy="64" r="4.5" fill="#606b76"/><clipPath id="floods-c2-1"><path d="M276 40 C 300 16, 396 18, 408 48 C 418 78, 388 112, 336 110 C 300 108, 262 88, 276 40 Z"/></clipPath><path d="M276 40 C 300 16, 396 18, 408 48 C 418 78, 388 112, 336 110 C 300 108, 262 88, 276 40 Z" fill="#eff3f5" stroke="#606b76" stroke-width="1.2"/><circle cx="348" cy="66" r="4.5" fill="#606b76"/></g><text x="58" y="162" font-size="12.5" fill="#6563aa" text-anchor="middle">now</text><text x="206" y="162" font-size="12.5" fill="#606b76" text-anchor="middle">next</text><text x="348" y="162" font-size="12.5" fill="#606b76" text-anchor="middle">later</text><text x="0" y="204" font-size="14" fill="#008b83" text-anchor="start" font-weight="600">Brook</text><text x="420" y="204" font-size="12.5" fill="#606b76" text-anchor="end">one flood over the whole volume</text><g transform="translate(0 214)"><clipPath id="floods-c0-3"><path d="M10 40 C 20 8, 110 6, 130 34 C 140 60, 128 104, 96 110 C 50 118, 4 84, 10 40 Z"/></clipPath><path d="M10 40 C 20 8, 110 6, 130 34 C 140 60, 128 104, 96 110 C 50 118, 4 84, 10 40 Z" fill="#eff3f5" stroke="#606b76" stroke-width="1.2"/><g clip-path="url(#floods-c0-3)"><circle cx="54" cy="62" r="90" fill="#e3f2f0" stroke="#008b83" stroke-opacity="0.35"/><circle cx="54" cy="62" r="60" fill="#e3f2f0" stroke="#008b83" stroke-opacity="0.6"/><circle cx="54" cy="62" r="30" fill="#e3f2f0" stroke="#008b83" stroke-opacity="0.9"/></g><circle cx="54" cy="62" r="4.5" fill="#008b83"/><clipPath id="floods-c1-3"><path d="M130 34 C 160 14, 250 10, 276 40 C 292 64, 262 106, 212 110 C 170 114, 124 96, 128 70 C 130 56, 126 44, 130 34 Z"/></clipPath><path d="M130 34 C 160 14, 250 10, 276 40 C 292 64, 262 106, 212 110 C 170 114, 124 96, 128 70 C 130 56, 126 44, 130 34 Z" fill="#eff3f5" stroke="#606b76" stroke-width="1.2"/><g clip-path="url(#floods-c1-3)"><circle cx="206" cy="64" r="90" fill="#e3f2f0" stroke="#008b83" stroke-opacity="0.35"/><circle cx="206" cy="64" r="60" fill="#e3f2f0" stroke="#008b83" stroke-opacity="0.6"/><circle cx="206" cy="64" r="30" fill="#e3f2f0" stroke="#008b83" stroke-opacity="0.9"/></g><circle cx="206" cy="64" r="4.5" fill="#008b83"/><clipPath id="floods-c2-3"><path d="M276 40 C 300 16, 396 18, 408 48 C 418 78, 388 112, 336 110 C 300 108, 262 88, 276 40 Z"/></clipPath><path d="M276 40 C 300 16, 396 18, 408 48 C 418 78, 388 112, 336 110 C 300 108, 262 88, 276 40 Z" fill="#eff3f5" stroke="#606b76" stroke-width="1.2"/><g clip-path="url(#floods-c2-3)"><circle cx="348" cy="66" r="90" fill="#e3f2f0" stroke="#008b83" stroke-opacity="0.35"/><circle cx="348" cy="66" r="60" fill="#e3f2f0" stroke="#008b83" stroke-opacity="0.6"/><circle cx="348" cy="66" r="30" fill="#e3f2f0" stroke="#008b83" stroke-opacity="0.9"/></g><circle cx="348" cy="66" r="4.5" fill="#008b83"/></g><text x="0" y="352" font-size="12.5" fill="#606b76" text-anchor="start">Waves stop at object borders, so each object gets its own field.</text></svg>
