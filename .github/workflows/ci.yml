name: CI

# CPU only: these runners have no NVIDIA GPU, so the GPU tests run locally.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18" # the release workflow's uv
          enable-cache: false
      - name: Check that uv.lock is up to date
        run: uv lock --locked
      - name: Install the locked tools
        run: |
          mkdir -p build
          uv export --locked --only-group ci --no-emit-project -o build/ci.txt
          uv venv build/tools --python 3.12
          uv pip install --python build/tools/bin/python --require-hashes -r build/ci.txt
      - name: Lint Python
        run: build/tools/bin/ruff check .
      - name: Lint the workflows
        run: uvx --from actionlint-py==1.7.12.25 --with shellcheck-py==0.11.0.1 actionlint
      - name: Audit the workflows
        run: uvx zizmor@1.30.1 --offline --min-severity medium .github/workflows

  wheel:
    name: wheel (Python ${{ matrix.python }}, CUDA ${{ matrix.cuda }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    # The CUDA images have no git; checkout downloads the tree instead.
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
        cuda: ["12.3"]
        include:
          - cuda: "12.3"
            image: nvidia/cuda:12.3.2-devel-ubuntu22.04@sha256:6655d5fc2fb48580255a5021a81c379c325a457b74b77ac823ed67e4faa32aeb
          - python: "3.12"
            cuda: "13.0"
            image: nvidia/cuda:13.0.1-devel-ubuntu22.04@sha256:93a8d207db5aaa6384f834a6bf70d417433f709e61b57a91e7cc99c16172f49c
    env:
      PY: ${{ matrix.python }}
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18" # the release workflow's uv
          enable-cache: false
      - name: Install Python and the locked build tools
        run: |
          mkdir -p build
          uv python install "$PY"
          uv export --locked --only-group ci --no-emit-project -o build/ci.txt
          uv venv build/frontend --python "$PY"
          uv pip install --python build/frontend/bin/python --require-hashes -r build/ci.txt
      # Without --sdist or --wheel, build makes the sdist and then the wheel from the sdist.
      - name: Build the sdist, then a wheel from the sdist
        run: build/frontend/bin/python -m build --no-isolation -Ccmake.define.CMAKE_CUDA_ARCHITECTURES=89
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-py${{ matrix.python }}-cuda${{ matrix.cuda }}
          path: dist/brook-*.whl
          if-no-files-found: error

  wheel-test:
    name: wheel-test (Python ${{ matrix.python }}, CUDA ${{ matrix.cuda }})
    needs: wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    # No CUDA toolkit: the wheel must bring its own CUDA runtime.
    container: ubuntu:22.04@sha256:b8b6ee6aa931ecd9d0d952abc34dc0e5f7c6a30c6bb71b079fe399fde0329c02
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
        cuda: ["12.3"]
        include:
          - python: "3.12"
            cuda: "13.0"
    env:
      PY: ${{ matrix.python }}
      CUDA_VISIBLE_DEVICES: ""
      BROOK_TEST_EXPECT_BUNDLED_CUDART: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18" # the release workflow's uv
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-py${{ matrix.python }}-cuda${{ matrix.cuda }}
          path: dist
      # The wheel alone first: the test tools must not hide a missing runtime dependency.
      - name: Install the wheel alone and import it
        run: |
          uv python install "$PY"
          uv venv build/installed --python "$PY"
          uv pip install --python build/installed/bin/python dist/brook-*.whl
          build/installed/bin/python -I -c "import brook, osteoid, tqdm"
      - name: Run the CPU tests
        run: |
          mkdir -p build
          uv export --locked --only-group ci --no-emit-project -o build/ci.txt
          uv pip install --python build/installed/bin/python --require-hashes -r build/ci.txt
          build/installed/bin/python -I -m pytest tests/python -m "not gpu" -q

  sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    container: nvidia/cuda:12.3.2-devel-ubuntu22.04@sha256:6655d5fc2fb48580255a5021a81c379c325a457b74b77ac823ed67e4faa32aeb
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18" # the release workflow's uv
          enable-cache: false
      - name: Install pkg-config and the locked build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends pkg-config
          mkdir -p build
          uv export --locked --only-group ci --no-emit-project -o build/ci.txt
          uv venv build/tools --python 3.12
          uv pip install --python build/tools/bin/python --require-hashes -r build/ci.txt
          echo "$PWD/build/tools/bin" >> "$GITHUB_PATH"
      - name: Build the SDK and its tests
        run: |
          cmake -S . -B build/sdk -G Ninja -DCMAKE_BUILD_TYPE=Release -DBROOK_BUILD_PYTHON=OFF \
            -DBROOK_BUILD_TESTS=ON -DCMAKE_CUDA_ARCHITECTURES=89
          cmake --build build/sdk
      - name: Run the tests that need no GPU
        run: ctest --test-dir build/sdk --output-on-failure -L cpu
      - name: Install the SDK
        run: cmake --install build/sdk --prefix "$PWD/build/prefix" --component SDK
      - name: Build a C consumer with pkg-config
        run: |
          export PKG_CONFIG_PATH="$PWD/build/prefix/lib/pkgconfig"
          read -ra flags <<< "$(pkg-config --cflags --libs brook)"
          cc cpp/tests/c_smoke.c "${flags[@]}" -o build/c_consumer
      - name: Build a CMake consumer with find_package(Brook)
        run: |
          cmake -S cpp/tests/consumer -B build/consumer -G Ninja -DCMAKE_PREFIX_PATH="$PWD/build/prefix"
          cmake --build build/consumer

  # The one check the main branch ruleset requires: it passes only when every job above passed.
  ci-ok:
    name: ci-ok
    needs: [checks, wheel, wheel-test, sdk]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check that every CI job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "::error::a CI job ended with: $result"; exit 1; }
          done
